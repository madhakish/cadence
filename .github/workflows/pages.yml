name: Deploy site and web app (Pages)

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

# Actions pinned to full commit SHAs (version in comment) — see ci.yml.
jobs:
  # Manual recovery path. Normal main-branch deploys live in ci.yml and reuse
  # its already-passing web-tests job instead of running this suite twice.
  test:
    name: Web tests
    if: github.ref == 'refs/heads/main'
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Require successful validation for this exact main commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: node .github/scripts/verify-pages-recovery.mjs
      - name: Install pinned test deps
        working-directory: web
        run: npm ci
      - name: Full web regression suite
        working-directory: web
        run: npm test

  deploy:
    name: Deploy to GitHub Pages
    needs: test
    runs-on: macos-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Stamp build version into the service worker
        # Changes sw.js every deploy → browsers install the new worker and
        # refresh the cached app. Without this, installed phones never update.
        run: |
          sed -i.bak "s/__BUILD__/${GITHUB_SHA::12}/" web/app/sw.js
          rm web/app/sw.js.bak
      - name: Upload web/ as Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: web
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
