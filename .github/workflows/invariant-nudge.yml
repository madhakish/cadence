name: Invariant nudge

# Advisory only (#95): a pull request carrying `fix:` commits that does not
# touch docs/reference/invariants.md gets one comment, updated in place, with
# draft registry entries. It never blocks a merge.
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  nudge:
    # Forks receive a read-only token; the nudge only runs for same-repo PRs.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Draft or refresh the registry nudge
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: bash .github/scripts/invariant-nudge.sh
