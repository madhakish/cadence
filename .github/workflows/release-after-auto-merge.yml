name: Release after auto-merge

# auto-merge.yml enables native auto-merge with the workflow token, so GitHub
# performs those merges as github-actions[bot]. GitHub starts no workflow for
# a push made with GITHUB_TOKEN, so the merge never reaches the `push` run of
# ci.yml, the only path to semantic-release, Pages and TestFlight (#299).
# workflow_dispatch is the one event that token may still start, and a
# dispatched ci.yml run takes the same release queue and gates as a push.
# Human merges start their own push run and are not dispatched again.
on:
  pull_request_target:
    types: [closed]

permissions:
  actions: write

jobs:
  dispatch:
    if: >-
      github.event.pull_request.merged &&
      github.event.pull_request.merged_by.login == 'github-actions[bot]' &&
      github.event.pull_request.base.ref == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # No checkout: the write token never executes pull-request code.
      # A dispatch has no push diff to classify, so it runs the full
      # shipped-store migration suite rather than skipping it.
      - name: Dispatch main CI for the merged commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.repository.default_branch }}
        run: gh workflow run ci.yml --repo "$GH_REPO" --ref "$BRANCH" -f full_migrations=true
