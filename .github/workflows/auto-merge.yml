name: Auto-merge

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, edited]

# The merge must not be made with the workflow token: GitHub starts no
# workflow for its events, so a merge it performs never reaches the main push
# run of ci.yml (releases, Pages, TestFlight) (#299). AUTO_MERGE_TOKEN is a
# fine-grained token or GitHub App token with contents and pull-request write.
permissions: {}

concurrency:
  group: auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  enable:
    if: >-
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      AUTO_MERGE_TOKEN: ${{ secrets.AUTO_MERGE_TOKEN }}
    steps:
      - name: Skip without a merge token
        if: env.AUTO_MERGE_TOKEN == ''
        run: echo "::notice::AUTO_MERGE_TOKEN is not set; auto-merge skipped so merges keep starting main CI."
      # No checkout: the write token never executes pull-request code.
      # GitHub's required checks and review blocks remain the merge authority.
      - name: Enable squash auto-merge for the observed PR head
        if: env.AUTO_MERGE_TOKEN != ''
        env:
          GH_TOKEN: ${{ env.AUTO_MERGE_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: gh pr merge "$PR_NUMBER" --repo "$GH_REPO" --auto --squash --match-head-commit "$HEAD_SHA"
