name: iPhone visual proof

# Deliberate visual QA, manually or on a same-repository PR with visual-proof.
# Ordinary PRs retain one native build. Opted-in captures wait for green CI.

on:
  workflow_dispatch:
  pull_request:
    types: [labeled, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  actions: read

concurrency:
  group: visual-proof-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       contains(github.event.pull_request.labels.*.name, 'visual-proof'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Pin capture source
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Verify gate behavior
        run: node .github/scripts/test-visual-ci.mjs
      - name: Wait for exact-head CI
        if: github.event_name == 'pull_request'
        env:
          GH_REPO: ${{ github.repository }}
          HEAD_SHA: ${{ steps.source.outputs.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/wait-for-visual-ci.mjs
  capture:
    name: Capture iPhone surfaces
    needs: gate
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.sha }}
          persist-credentials: false
      - name: Install XcodeGen
        run: brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Select and boot an iPhone
        id: simulator
        run: |
          device_id="$(python3 - <<'PY'
          import json, subprocess

          payload = json.loads(subprocess.check_output(
              ["xcrun", "simctl", "list", "devices", "available", "-j"],
              text=True,
          ))
          phones = [
              device
              for runtime in payload["devices"].values()
              for device in runtime
              if device["name"].startswith("iPhone")
          ]
          preferred = next((d for d in phones if d["name"] == "iPhone 16 Pro"), None)
          selected = preferred or next((d for d in phones if "Pro" in d["name"]), None) or phones[0]
          print(selected["udid"])
          PY
          )"
          echo "device-id=$device_id" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$device_id" 2>/dev/null || true
          xcrun simctl bootstatus "$device_id" -b
      - name: Render and capture visual proof
        run: >-
          xcodebuild test
          -project Cadence.xcodeproj
          -scheme CadenceVisualProof
          -configuration Debug
          -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.device-id }}'
          -derivedDataPath build/visual-proof
          -resultBundlePath build/VisualProof.xcresult
          -only-testing:CadenceVisualProofUITests/VisualProofUITests/test02CurrentSessionAndExactPlateStack
          -only-testing:CadenceVisualProofUITests/VisualProofUITests/test03ExercisePaneAndPreservedAnatomy
          -only-testing:CadenceVisualProofUITests/VisualProofUITests/test04PlateCalculatorHero
          -only-testing:CadenceVisualProofUITests/VisualProofUITests/test09WorkoutPreviewInspection
          -only-testing:CadenceVisualProofUITests/VisualProofUITests/test10PlankCountdownAndLog
          -only-testing:CadenceVisualProofUITests/VisualProofUITests/test11PlankTimerAtAccessibilityTextSize
          -only-testing:CadenceVisualProofUITests/VisualProofUITests/test13SetCompletionKeepsDominantBlockStill
      - name: Export screenshot attachments
        if: always()
        run: |
          mkdir -p dist/visual-proof
          git rev-parse HEAD > dist/visual-proof/commit.txt
          if [[ -d build/VisualProof.xcresult ]]; then
            xcrun xcresulttool export attachments \
              --path build/VisualProof.xcresult \
              --output-path dist/visual-proof
          fi
      - name: Upload visual proof
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cadence-iphone-visual-proof-${{ needs.gate.outputs.sha }}
          path: dist/visual-proof
          if-no-files-found: warn
