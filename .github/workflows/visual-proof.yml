name: iPhone visual proof

'on':
  workflow_dispatch:

permissions:
  contents: read

jobs:
  launch:
    name: Photograph the Astra Foundry cold open
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 4e680f461f81f193e0dcb0bca58748c27921bafb
          persist-credentials: false
      - name: Prepare native capture
        run: |
          mkdir -p build evidence
          git rev-parse HEAD > evidence/source-commit.txt
          xcodebuild -version > evidence/xcode.txt
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          xcodegen generate
          device_id="$(python3 .github/visual-proof/select-simulator.py)"
          bash .github/visual-proof/boot-simulator.sh "$device_id"
          echo "DEVICE_ID=$device_id" >> "$GITHUB_ENV"
          xcrun simctl list devices booted -j > evidence/booted-devices.json
      - name: Capture light and dark appearances
        run: |
          for appearance in light dark; do
            xcrun simctl ui "$DEVICE_ID" appearance "$appearance"
            action=test
            if [[ "$appearance" == dark ]]; then action=test-without-building; fi
            xcodebuild "$action" -project Cadence.xcodeproj -scheme CadenceVisualProof -configuration Debug \
              -destination "platform=iOS Simulator,id=$DEVICE_ID" -parallel-testing-enabled NO \
              -derivedDataPath build/launch -resultBundlePath "build/$appearance.xcresult" \
              -only-testing:CadenceVisualProofUITests/LaunchSplashProofUITests/testLaunchSplashFrames
          done
      - name: Export native screenshots
        if: always()
        run: |
          for appearance in light dark; do
            result="build/$appearance.xcresult"
            if [[ -d "$result" ]]; then
              mkdir -p "evidence/$appearance"
              xcrun xcresulttool export attachments --path "$result" --output-path "evidence/$appearance"
              xcrun xcresulttool get test-results summary --path "$result" > "evidence/$appearance/test-summary.json"
            fi
          done
      - name: Upload native frames and results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: cadence-astra-foundry-launch-4e680f4
          path: |
            evidence/
            !evidence/**/*.mp4
            !evidence/**/*.mov
          retention-days: 14
          if-no-files-found: warn
