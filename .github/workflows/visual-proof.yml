name: iPhone visual proof

# Manual-only render target for deliberate visual QA. Ordinary pull requests
# retain the repository's single gated iOS build in CI.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: visual-proof-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    name: Capture iPhone surfaces
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install XcodeGen
        run: brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Select and boot an iPhone
        id: simulator
        run: |
          device_id="$(python3 - <<'PY'
          import json, subprocess

          payload = json.loads(subprocess.check_output(
              ["xcrun", "simctl", "list", "devices", "available", "-j"],
              text=True,
          ))
          phones = [
              device
              for runtime in payload["devices"].values()
              for device in runtime
              if device["name"].startswith("iPhone")
          ]
          preferred = next((d for d in phones if d["name"] == "iPhone 16 Pro"), None)
          selected = preferred or next((d for d in phones if "Pro" in d["name"]), None) or phones[0]
          print(selected["udid"])
          PY
          )"
          echo "device-id=$device_id" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$device_id" 2>/dev/null || true
          xcrun simctl bootstatus "$device_id" -b
      - name: Render and capture visual proof
        run: >-
          xcodebuild test
          -project Cadence.xcodeproj
          -scheme CadenceVisualProof
          -configuration Debug
          -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.device-id }}'
          -derivedDataPath build/visual-proof
          -resultBundlePath build/VisualProof.xcresult
      - name: Export screenshot attachments
        if: always()
        run: |
          mkdir -p dist/visual-proof
          if [[ -d build/VisualProof.xcresult ]]; then
            xcrun xcresulttool export attachments \
              --path build/VisualProof.xcresult \
              --output-path dist/visual-proof
          fi
      - name: Upload visual proof
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cadence-iphone-visual-proof
          path: dist/visual-proof
          if-no-files-found: warn
