name: iPhone visual proof

on:
  pull_request:
    paths:
      - "Cadence/**"
      - "CadenceCore/**"
      - "CadenceVisualProofUITests/**"
      - ".github/visual-proof/**"
      - "project.yml"
      - ".github/workflows/visual-proof.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: visual-proof-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    name: Capture iPhone surfaces
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install XcodeGen
        run: brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Select and boot an iPhone
        id: simulator
        run: |
          device_id="$(python3 - <<'PY'
          import json, subprocess

          payload = json.loads(subprocess.check_output(
              ["xcrun", "simctl", "list", "devices", "available", "-j"],
              text=True,
          ))
          phones = [
              device
              for runtime in payload["devices"].values()
              for device in runtime
              if device["name"].startswith("iPhone")
          ]
          preferred = next((d for d in phones if d["name"] == "iPhone 16 Pro"), None)
          selected = preferred or next((d for d in phones if "Pro" in d["name"]), None) or phones[0]
          print(selected["udid"])
          PY
          )"
          echo "device-id=$device_id" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$device_id" 2>/dev/null || true
          xcrun simctl bootstatus "$device_id" -b
      - name: Render and capture visual proof
        run: >-
          xcodebuild test
          -project Cadence.xcodeproj
          -scheme CadenceVisualProof
          -configuration Debug
          -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.device-id }}'
          -derivedDataPath build/visual-proof
          -resultBundlePath build/VisualProof.xcresult
      - name: Export screenshot attachments
        if: always()
        run: |
          mkdir -p dist/visual-proof
          if [[ -d build/VisualProof.xcresult ]]; then
            xcrun xcresulttool export attachments \
              --path build/VisualProof.xcresult \
              --output-path dist/visual-proof
          fi
      - name: Upload visual proof
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cadence-iphone-visual-proof
          path: dist/visual-proof
          if-no-files-found: warn

  baseline:
    name: Capture exact pre-pass iPhone surfaces
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Check out proof harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: proof-source
      - name: Check out exact pre-pass revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: 1bdcc3d68ac5eb51b352ddddb0f98cf25e4dfa5c
          path: baseline
      - name: Install proof-only instrumentation
        run: |
          cp proof-source/Cadence/Seed/VisualProofSeed.swift baseline/Cadence/Seed/VisualProofSeed.swift
          mkdir -p baseline/CadenceBaselineVisualProofUITests
          cp proof-source/.github/visual-proof/BaselineVisualProofUITests.swift baseline/CadenceBaselineVisualProofUITests/VisualProofUITests.swift
          cd baseline
          git apply ../proof-source/.github/visual-proof/baseline-instrumentation.patch
      - name: Install XcodeGen
        run: brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
      - name: Generate baseline Xcode project
        working-directory: baseline
        run: xcodegen generate
      - name: Select and boot an iPhone
        id: baseline-simulator
        run: |
          device_id="$(python3 - <<'PY'
          import json, subprocess

          payload = json.loads(subprocess.check_output(
              ["xcrun", "simctl", "list", "devices", "available", "-j"],
              text=True,
          ))
          phones = [
              device
              for runtime in payload["devices"].values()
              for device in runtime
              if device["name"].startswith("iPhone")
          ]
          preferred = next((d for d in phones if d["name"] == "iPhone 16 Pro"), None)
          selected = preferred or next((d for d in phones if "Pro" in d["name"]), None) or phones[0]
          print(selected["udid"])
          PY
          )"
          echo "device-id=$device_id" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$device_id" 2>/dev/null || true
          xcrun simctl bootstatus "$device_id" -b
      - name: Render exact baseline
        working-directory: baseline
        run: >-
          xcodebuild test
          -project Cadence.xcodeproj
          -scheme CadenceBaselineVisualProof
          -configuration Debug
          -destination 'platform=iOS Simulator,id=${{ steps.baseline-simulator.outputs.device-id }}'
          -derivedDataPath build/baseline-proof
          -resultBundlePath build/BaselineProof.xcresult
      - name: Export baseline screenshots
        if: always()
        working-directory: baseline
        run: |
          mkdir -p dist/baseline-proof
          if [[ -d build/BaselineProof.xcresult ]]; then
            xcrun xcresulttool export attachments \
              --path build/BaselineProof.xcresult \
              --output-path dist/baseline-proof
          fi
      - name: Upload baseline proof
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cadence-iphone-baseline-proof
          path: baseline/dist/baseline-proof
          if-no-files-found: warn
