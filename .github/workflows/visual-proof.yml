name: iPhone visual proof

# Deliberate visual QA, manually or on a same-repository PR with visual-proof.
# Ordinary PRs retain one native build. Opted-in captures start once the exact
# head has passed CI's fast Linux suites; the macOS build stays the merge gate.
# (A DerivedData cache was measured at no gain: the UI tests, not the compile,
# are the capture's cost.)

on:
  workflow_dispatch:
  pull_request:
    types: [labeled, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  actions: read

concurrency:
  group: visual-proof-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       contains(github.event.pull_request.labels.*.name, 'visual-proof'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Pin capture source
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Verify gate behavior
        run: node .github/scripts/test-visual-ci.mjs
      - name: Wait for exact-head fast suites
        if: github.event_name == 'pull_request'
        env:
          GH_REPO: ${{ github.repository }}
          HEAD_SHA: ${{ steps.source.outputs.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/wait-for-visual-ci.mjs
  capture:
    name: Capture iPhone surfaces
    needs: gate
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.sha }}
          persist-credentials: false
      - name: Install XcodeGen
        run: brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Select and boot an iPhone
        id: simulator
        run: |
          device_id="$(python3 .github/visual-proof/select-simulator.py)"
          echo "device-id=$device_id" >> "$GITHUB_OUTPUT"
          bash .github/visual-proof/boot-simulator.sh "$device_id"
      - name: Render and capture visual proof
        run: >-
          xcodebuild test
          -project Cadence.xcodeproj
          -scheme CadenceVisualProof
          -configuration Debug
          -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.device-id }}'
          -derivedDataPath build/visual-proof
          -resultBundlePath build/VisualProof.xcresult
          -only-testing:CadenceVisualProofUITests/VisualProofUITests/test01HomeAndAdHocWork
          -only-testing:CadenceVisualProofUITests/VisualProofUITests/test02CurrentSessionAndExactPlateStack
          -only-testing:CadenceVisualProofUITests/VisualProofUITests/test03ExercisePaneAndPreservedAnatomy
          -only-testing:CadenceVisualProofUITests/VisualProofUITests/test04PlateCalculatorHero
          -only-testing:CadenceVisualProofUITests/VisualProofUITests/test05SettingsAndHistory
          -only-testing:CadenceVisualProofUITests/VisualProofUITests/test08PlateButtonNeverCoversContent
          -only-testing:CadenceVisualProofUITests/VisualProofUITests/test09WorkoutPreviewInspection
          -only-testing:CadenceVisualProofUITests/VisualProofUITests/test10PlankCountdownAndLog
          -only-testing:CadenceVisualProofUITests/VisualProofUITests/test11PlankTimerAtAccessibilityTextSize
          -only-testing:CadenceVisualProofUITests/VisualProofUITests/test12AccessibilityAudit
          -only-testing:CadenceVisualProofUITests/VisualProofUITests/test13SetCompletionKeepsDominantBlockStill
          -only-testing:CadenceVisualProofUITests/VisualProofUITests/test14CalculatorTargetAtAccessibilityTextSize
          -only-testing:CadenceVisualProofUITests/VisualProofUITests/test15PlateThemesLoadedBar
          -only-testing:CadenceVisualProofUITests/VisualProofUITests/test16FavoritesInLibraryAndSessionPicker
          -only-testing:CadenceVisualProofUITests/VisualProofUITests/test17FavoritesAtAccessibilityTextSize
          -only-testing:CadenceVisualProofUITests/VisualProofUITests/test18DP1CalculatorStates
          -only-testing:CadenceVisualProofUITests/VisualProofUITests/test19AppThemeCanvases
          -only-testing:CadenceVisualProofUITests/VisualProofUITests/test20EquipmentContextAndEmptyStates
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Replay the synthetic native fixture and capture the web matrix
        run: |
          mkdir -p dist/visual-proof
          app_data="$(xcrun simctl get_app_container '${{ steps.simulator.outputs.device-id }}' com.madhakish.Cadence data)"
          cp "$app_data/tmp/cadence-visual-proof.json" dist/visual-proof/native-fixture.json
          npm ci --prefix web
          (cd web && npx --no-install playwright install chromium)
          node web/tools/capture-design-pass.mjs dist/visual-proof/native-fixture.json dist/visual-proof/web '${{ needs.gate.outputs.sha }}'
      - name: Export screenshot attachments
        if: always()
        run: |
          mkdir -p dist/visual-proof
          git rev-parse HEAD > dist/visual-proof/commit.txt
          if [[ -d build/VisualProof.xcresult ]]; then
            xcrun xcresulttool export attachments \
              --path build/VisualProof.xcresult \
              --output-path dist/visual-proof
          fi
      - name: Upload visual proof
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cadence-iphone-visual-proof-${{ needs.gate.outputs.sha }}
          path: |
            dist/visual-proof
            !dist/visual-proof/*.mp4
          if-no-files-found: warn

  edge-widths:
    name: Capture native ${{ matrix.width }} pt
    needs: gate
    runs-on: macos-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        width: [375, 430]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.sha }}
          persist-credentials: false
      - name: Install XcodeGen
        run: brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Select and boot the exact edge-width iPhone
        id: simulator
        run: |
          device_id="$(python3 .github/visual-proof/select-edge-simulator.py '${{ matrix.width }}')"
          echo "device-id=$device_id" >> "$GITHUB_OUTPUT"
          bash .github/visual-proof/boot-simulator.sh "$device_id"
      - name: Capture standard and maximum-text browsing and equipment states
        run: >-
          xcodebuild test
          -project Cadence.xcodeproj
          -scheme CadenceVisualProof
          -configuration Debug
          -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.device-id }}'
          -derivedDataPath build/visual-edge
          -resultBundlePath build/VisualEdge.xcresult
          -only-testing:CadenceVisualProofUITests/VisualProofUITests/test16FavoritesInLibraryAndSessionPicker
          -only-testing:CadenceVisualProofUITests/VisualProofUITests/test17FavoritesAtAccessibilityTextSize
          -only-testing:CadenceVisualProofUITests/VisualProofUITests/test18DP1CalculatorStates
          -only-testing:CadenceVisualProofUITests/VisualProofUITests/test20EquipmentContextAndEmptyStates
      - name: Export edge screenshot attachments
        if: always()
        run: |
          mkdir -p dist/visual-edge
          git rev-parse HEAD > dist/visual-edge/commit.txt
          xcrun simctl list devices available -j > dist/visual-edge/devices.json
          if [[ -d build/VisualEdge.xcresult ]]; then
            xcrun xcresulttool export attachments --path build/VisualEdge.xcresult --output-path dist/visual-edge
            xcrun xcresulttool get test-results summary --path build/VisualEdge.xcresult > dist/visual-edge/test-summary.json
          fi
      - name: Upload exact-width proof
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cadence-native-${{ matrix.width }}pt-${{ needs.gate.outputs.sha }}
          path: |
            dist/visual-edge
            !dist/visual-edge/*.mp4
          if-no-files-found: warn

  baseline:
    name: Capture exact DP-1 baseline
    needs: gate
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Check out proof harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.sha }}
          persist-credentials: false
          path: proof-source
      - name: Check out the original application
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 11895fb95cde9e4b938831098d00dd0350b45bc2
          persist-credentials: false
          path: baseline
      - name: Install the recorded proof-only instrumentation
        run: python3 proof-source/.github/visual-proof/install-baseline.py proof-source baseline
      - name: Install XcodeGen
        run: brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
      - name: Generate baseline Xcode project
        working-directory: baseline
        run: xcodegen generate
      - name: Select and boot the DP-1 iPhone
        id: simulator
        run: |
          device_id="$(python3 proof-source/.github/visual-proof/select-simulator.py)"
          echo "device-id=$device_id" >> "$GITHUB_OUTPUT"
          bash proof-source/.github/visual-proof/boot-simulator.sh "$device_id"
      - name: Render original application surfaces
        working-directory: baseline
        run: >-
          xcodebuild test
          -project Cadence.xcodeproj
          -scheme CadenceBaselineVisualProof
          -configuration Debug
          -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.device-id }}'
          -derivedDataPath build/baseline-proof
          -resultBundlePath build/BaselineProof.xcresult
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Capture the original web application at the fixed viewports
        run: |
          mkdir -p baseline/dist/baseline-proof
          app_data="$(xcrun simctl get_app_container '${{ steps.simulator.outputs.device-id }}' com.madhakish.Cadence data)"
          cp "$app_data/tmp/cadence-visual-proof.json" baseline/dist/baseline-proof/native-fixture.json
          npm ci --prefix proof-source/web
          (cd proof-source/web && npx --no-install playwright install chromium)
          node proof-source/web/tools/capture-design-pass.mjs baseline/dist/baseline-proof/native-fixture.json baseline/dist/baseline-proof/web 11895fb95cde9e4b938831098d00dd0350b45bc2 baseline/web before
      - name: Export baseline screenshot attachments and instrumentation diff
        if: always()
        working-directory: baseline
        run: |
          mkdir -p dist/baseline-proof
          git rev-parse HEAD > dist/baseline-proof/commit.txt
          git diff -- Cadence project.yml > dist/baseline-proof/instrumentation.patch
          if [[ -d build/BaselineProof.xcresult ]]; then
            xcrun xcresulttool export attachments --path build/BaselineProof.xcresult --output-path dist/baseline-proof
          fi
      - name: Upload exact baseline proof
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cadence-dp1-baseline-${{ needs.gate.outputs.sha }}
          path: |
            baseline/dist/baseline-proof
            !baseline/dist/baseline-proof/*.mp4
          if-no-files-found: warn
