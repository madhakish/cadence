name: Agent session directory
description: Read GitHub Discussion session records and render a directory without launching agents
inputs:
  repository:
    description: Repository whose Discussions to read (owner/name)
    required: true
  token:
    description: Token with read access to the target repository Discussions
    required: true
  max-requests:
    description: Maximum GraphQL calls; an incomplete scan fails visibly
    default: '100'
  limit:
    description: Maximum records across the scan
    default: '1000'
runs:
  using: composite
  steps:
    - name: Render session directory
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        COORD_REPOSITORY: ${{ inputs.repository }}
        COORD_MAX_REQUESTS: ${{ inputs.max-requests }}
        COORD_LIMIT: ${{ inputs.limit }}
        COORD_ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail
        output="$(mktemp)"
        trap 'rm -f "$output"' EXIT
        python3 "$COORD_ACTION_PATH/coord.py" --repo "$COORD_REPOSITORY" \
          --max-requests "$COORD_MAX_REQUESTS" --limit "$COORD_LIMIT" directory > "$output"
        cat "$output" >> "$GITHUB_STEP_SUMMARY"
