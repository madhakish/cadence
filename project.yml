# XcodeGen spec. Run `xcodegen generate` in this directory to produce
# Cadence.xcodeproj (install: `brew install xcodegen`).
name: Cadence
options:
  bundleIdPrefix: com.madhakish
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"

packages:
  CadenceCore:
    path: CadenceCore

targets:
  Cadence:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - Cadence
    dependencies:
      - package: CadenceCore
      - target: CadenceWidgets   # embedded so the workout Live Activity + rest control ship in the app
    entitlements:
      path: Cadence/Cadence.entitlements
      properties:
        com.apple.developer.healthkit: true
    info:
      path: Cadence/Info.plist
      properties:
        CFBundleDisplayName: Cadence
        # Reference the build settings (don't let XcodeGen bake literal
        # "1.0"/"1"): the TestFlight lane overrides MARKETING_VERSION /
        # CURRENT_PROJECT_VERSION at archive time, and a literal here would
        # silently win — which is why every upload read v1.0 regardless.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # No custom/non-exempt encryption — only standard OS + HTTPS, which is
        # export-exempt. Declaring this clears the "Missing Compliance" hold on
        # every TestFlight/App Store upload (no per-build manual answer).
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # No forced UIUserInterfaceStyle: the theme picker drives appearance via
        # SwiftUI .preferredColorScheme — .dark for the three dark themes, nil
        # (follow the OS) for System. A hard "Dark" here would override that and
        # keep System from ever going light.
        NSHealthUpdateUsageDescription: >-
          Optionally writes the workouts you complete — including any walking,
          running, or cycling distance you logged — plus your bodyweight and
          body fat percentage to Health. Off by default; you choose whether
          anything gets saved.
        NSHealthShareUsageDescription: >-
          Optionally reads walking, running, and cycling distance, workout
          energy, bodyweight, body fat percentage, heart rate variability,
          resting heart rate, and sleep, so Cadence can show them beside what
          you logged. Off by default and separate from writing. Cadence never
          changes your log on its own — it shows both numbers and you decide,
          and it ignores the data it wrote to Health itself.
        NSPhotoLibraryUsageDescription: >-
          Lets you store a photo of your gym membership barcode so your
          phone can stand in for the keychain tag.
        # Enables the workout Live Activity (Lock Screen + Dynamic Island):
        # session stopwatch that swaps to the rest countdown while resting.
        NSSupportsLiveActivities: true
        CFBundleURLTypes:
          - CFBundleURLName: com.madhakish.Cadence
            CFBundleURLSchemes:
              - cadence
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.madhakish.Cadence
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: false
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 0.1.0
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  # Widget extension: hosts the workout Live Activity (session stopwatch ⇄ rest
  # countdown), its Lock Screen App Intents, and the iOS 18 Control Center rest
  # control. Shares the Cadence/LiveActivity sources with the app so the
  # ActivityAttributes and intents are one definition across both processes;
  # links CadenceCore because the activity state embeds RestClock.State.
  CadenceWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - CadenceWidgets
      - Cadence/LiveActivity
    dependencies:
      - package: CadenceCore
    info:
      path: CadenceWidgets/Info.plist
      properties:
        CFBundleDisplayName: Cadence
        # Match the app's version/build (App Store rejects a mismatched extension).
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.madhakish.Cadence.Widgets
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: false
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 0.1.0

  # Hostless macOS test bundle for on-disk SwiftData compatibility. It compiles
  # only persistence models + program codecs/seeding so CI can create real old
  # SQLite stores and prove the current schema opens them without simulator UI.
  CadenceMigrationTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - Cadence/Models
      - Cadence/Seed/Seeder.swift
      - Cadence/Seed/ProgramTemplates.swift
      # Backup migrations are library migrations too. Compile the real native
      # codec into this hostless target so round-trip tests exercise production
      # code instead of a test-only DTO copy.
      - Cadence/Services/ExportService.swift
      - Cadence/Services/ImportService.swift
      - Cadence/Services/ProgramExportService.swift
      - Cadence/Services/ProgramImportService.swift
      # The banked-correction boundary is a models-only service; compiling it
      # here lets the hostless suite pin correction semantics on real SwiftData
      # rows (epic #155 Stage 0).
      - Cadence/Services/SessionCorrectionService.swift
      - CadenceMigrationTests
    dependencies:
      - package: CadenceCore
    settings:
      base:
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: true
        CODE_SIGNING_ALLOWED: false

schemes:
  Cadence:
    build:
      targets:
        Cadence: all
    test:
      targets:
        - package: CadenceCore/CadenceCoreTests
  CadenceMigrationTests:
    build:
      targets:
        CadenceMigrationTests: all
    test:
      targets:
        - CadenceMigrationTests
